spring:
  application:
    name: demo_app
  datasource:
    url: jdbc:h2:mem:demo_app;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  error:
    # ApiErrorController renders /error as a generic ApiError; these keep Spring's defaults from
    # ever adding detail should anything fall back to them.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      # Inactivity timeout, enforced server-side.
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        # Only the dev profile turns this off, for plain-HTTP localhost.
        secure: true

logging:
  structured:
    format:
      # ECS JSON console lines: machine-parseable and escaped. Only the dev profile turns this off.
      console: ecs

app:
  security:
    throttle:
      # Per-IP limits, in memory on this instance only. Each throttle forgets its oldest address
      # beyond this many, so a flood of addresses can't exhaust memory.
      max-tracked-ips: 100000
      login:
        # Failed logins only: successes never count.
        max-attempts: 20
        window: 15m
      registration:
        # Every request counts, whatever its outcome: this also caps username/email probing.
        max-attempts: 10
        window: 15m
      password-reset-request:
        # Every request counts, whatever its outcome: nobody can flood an inbox or probe at scale.
        max-attempts: 10
        window: 15m
    password-reset:
      # How long a reset link works. Only the newest unused link of an account works at all.
      token-ttl: 30m
  # app.frontend-url: the SPA's origin, which reset links point to. Only dev and test have a
  # default; anywhere else set APP_FRONTEND_URL, or startup fails.
