# --- Dev profile ---
# Local development: Vite dev server on :3000, Spring Boot on :8080 -- different
# ports but the same host, so these are still same-site, which is why SameSite=Lax
# over plain HTTP (no Secure) works here. Compare application-prod.properties, which
# tightens this to SameSite=Strict + Secure over HTTPS.

# H2 in-memory database, dev-only. Compare application-prod.properties, which
# points at its own datasource -- currently H2 too (no real prod DB
# implemented yet), but kept separate so that can change without touching
# this file.
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console for local inspection at /h2-console. Dev-only: a console this
# permissive has no business being reachable in a real deployment.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false

app.cors.allowed-origins=http://localhost:3000
app.frontend.base-url=http://localhost:3000

# Dev-only seeded admin account (Story 12): created on startup if no ADMIN user
# exists yet. A throwaway credential for local use only -- never carried into
# application-prod.properties, which requires these to be supplied externally.
app.admin.username=admin
app.admin.password=DevAdminPass123!
app.admin.role=ADMIN
app.admin.email=admin@localhost

# Dev-only extra seeded local user accounts, beyond the single ADMIN bootstrap
# above: LocalUsersSeedRunner creates any of these that don't already exist
# (by username) on startup. Never carried into application-prod.properties --
# prod only ever seeds the one ADMIN account above. Email isn't configurable
# here; it's always derived as "<username>@localhost". role is optional per
# entry and defaults to USER.
app.local.users[0].username=alice
app.local.users[0].role=ADMIN
app.local.users[0].password=DevAlicePass123!

app.local.users[1].username=bob
app.local.users[1].password=DevBobPass123!
