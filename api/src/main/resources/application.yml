# Base configuration. Profile-specific overrides live in application-dev.yml / application-prod.yml.
# Anything security-relevant defaults to the *safe* value here; the dev profile relaxes it.
spring:
  application:
    name: hello-auth-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    store-type: jdbc
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Idle timeout. There is deliberately no absolute session lifetime; see the Known Gaps section
      # of docs/decisions.md.
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: true

app:
  # Explicit allow-list. A wildcard is incompatible with credentialed requests and is never correct here.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    # No default: an unset admin password skips seeding rather than creating a guessable admin.
    password: ${APP_ADMIN_PASSWORD:}
  password-policy:
    min-length: 12
    # BCrypt silently ignores input past 72 bytes, so accepting longer would make
    # two different passwords open the same account. Reject at the boundary instead.
    max-length: 72
  lockout:
    max-failed-attempts: 5
    cooldown: 15m
  throttle:
    # Overridable because a browser test suite legitimately needs a higher ceiling: it calls from one
    # address and deliberately fails logins, so it would throttle itself partway through and every
    # later test would fail for a reason that has nothing to do with what it was testing.
    # See web/playwright.config.ts.
    max-failures: ${APP_THROTTLE_MAX_FAILURES:10}
    window: ${APP_THROTTLE_WINDOW:15m}
  password-reset:
    token-ttl: 20m

logging:
  level:
    root: INFO
    com.example.helloauth: INFO
