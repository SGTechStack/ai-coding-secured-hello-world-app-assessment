# The dev profile: plain-HTTP local development. Only what cannot hold without TLS differs from production.
server:
  servlet:
    session:
      cookie:
        # The __Host- prefix requires Secure, which plain HTTP cannot carry (ADR-058; REJ-061).
        name: SESSION
        secure: false
# The dev-only credential-link logger (ADR-057): the stubbed EmailService writes activation and reset links here, for a
# developer to follow. Three controls refuse it outside dev (ProhibitedConfigurationValidator, ResetLinkLoggerGuard and
# the read-only loggers endpoint).
logging:
  level:
    sg.securedhello.email.ResetLinkLogger: DEBUG
  # service.environment on every log line (LOG §5:347).
  structured:
    ecs:
      service:
        environment: dev
# The dev-only demo accounts (DemoAccountSeeder; DemoAccountsController): seeded on first start alongside the admin
# seed, and listed with their passwords and the admin's current TOTP code on the sign-in page. These values are public:
# outside dev nothing reads them, startup refuses them as the seed administrator's password, and it refuses a database
# that still holds a demo account (PublishedDemoValues). Set enabled to false to start without them.
app:
  security:
    # The dev device-cookie key (ADR-075), public: outside dev startup refuses it in any key slot (PublishedDemoValues),
    # and nothing else reads this file there. Every other environment supplies its own key (ADR-062).
    lockout:
      device:
        secret: RIwFIXZBRXDdHv1rLtl7v8J0u9R/q6WI1sfJOrhYPO4=
    authorization:
      # Dev-only routes open to anyone (AuthorizationMatrix#devWhitelist): the sign-in page's demo accounts
      # (DemoAccountsController). Outside dev the handler and this row are both absent, and setting it is refused.
      dev-whitelist:
        - method: GET
          path: /api/dev/demo-accounts
  dev:
    demo-accounts:
      enabled: true
      user-password: violet-harbour-signal-meadow
      admin-password: granite-falcon-ember-quarry
      # 20 bytes, RFC 4648 Base32: the demo admin's pre-enrolled TOTP secret.
      admin-totp-secret: X47C675OXQB5LUEX3C5MGK6A445A23M2
