spring.application.name=secured-hello-world

# Logging: ECS JSON everywhere (logback-spring.xml, EcsLogFormatter). Service fields on every line.
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=local
app.logging.directory=logs
app.logging.application-file=${app.logging.directory}/application.log
# The application log rolls over at this size (and daily).
app.logging.application-max-file-size=10MB
app.logging.audit-file=${app.logging.directory}/audit.log
# The EmailService stub's mailbox: its own file, never the application or audit log.
app.logging.email-file=${app.logging.directory}/email.log
# Audit history kept on disk, in days (at least 90). Central retention is a deployment requirement.
app.logging.audit-max-history-days=90
# SQL is logged only in dev (application-dev.properties), through the logger so output stays JSON.
spring.jpa.show-sql=false
# These libraries log JDBC URLs, database names and the database user at INFO.
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN
logging.level.org.flywaydb.core.FlywayExecutor=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN
# Hibernate logs JDBC errors with the database's message, which quotes the offending values (for
# example the username in a unique-constraint violation). Unexpected database errors are still
# logged once, sanitised, by the global error handler.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF

# API
app.api.base-path=/api
# Largest accepted request body, in bytes (max 10 MiB). The single body-size limit: larger bodies,
# with or without Content-Length, get 400 request_too_large before any controller runs.
app.api.max-request-body-bytes=16384
# CORS allowlist: required outside the dev profile (startup fails without it). No wildcards.
# app.cors.allowed-origins=https://app.example.gov

# Credential policy. Passwords are also capped at 72 UTF-8 bytes, all BCrypt reads.
app.credential.min-length=12
app.credential.max-length=64
app.credential.bcrypt-cost=12
app.credential.common-passwords=classpath:credential/common-passwords.txt
# Password History: how many of an Account's latest passwords (the current one included) may not be reused.
app.credential.history-length=3

# Lockout: this many consecutive wrong passwords make an Account Locked for this long.
app.lockout.threshold=5
app.lockout.duration=20m
# Login attempts per username, in memory (single instance). Beyond this: 429 with Retry-After.
app.rate-limit.login.capacity=10
app.rate-limit.login.period=1m
# Registrations per client address, in memory. Beyond this: 429 with Retry-After.
app.rate-limit.registration.capacity=10
app.rate-limit.registration.period=1h
# Reset requests per email address and per client address, in memory. Beyond either: 429 with Retry-After.
app.rate-limit.reset-request-email.capacity=3
app.rate-limit.reset-request-email.period=1h
app.rate-limit.reset-request-ip.capacity=10
app.rate-limit.reset-request-ip.period=1h
# Reset confirmations per client address (never per Account, ADR 0001: a token cannot be guessed).
app.rate-limit.reset-confirm.capacity=10
app.rate-limit.reset-confirm.period=1m
# Reports the SPA sends about itself per client address, so they cannot flood the application log.
app.rate-limit.client-events.capacity=60
app.rate-limit.client-events.period=1m

# Password reset: how long a Reset Token stays usable, and the SPA origin its emailed link points to.
app.password-reset.token-expiry=30m
app.password-reset.frontend-origin=http://localhost:3000
# IP Throttle: this many failed logins from one client address within the window block it for the
# block duration, across all usernames. In memory (single instance). The address is the direct
# connection address; behind a reverse proxy, set server.forward-headers-strategy and trust only it.
# Explicitly none: Spring Boot would otherwise trust X-Forwarded-For on a detected cloud platform
# (for example Kubernetes), and a client could then choose its own throttle key and source.ip_hash.
server.forward-headers-strategy=none
app.ip-throttle.threshold=20
app.ip-throttle.window=15m
app.ip-throttle.block-duration=15m
# HMAC-SHA-256 key for source.ip_hash in audit events. Required outside dev (startup fails without
# it): inject from the secrets manager, e.g. APP_IPHASH_KEY. Never commit it.
# app.ip-hash.key=

# Bootstrap Admin: created at startup when no Account holds the Admin role, and must change its
# password at first login. Required outside dev (startup fails without them): inject from the
# secrets manager, e.g. APP_BOOTSTRAPADMIN_USERNAME, APP_BOOTSTRAPADMIN_PASSWORD and
# APP_BOOTSTRAPADMIN_EMAIL. Never commit them. In dev, missing values fall back to
# admin / password / admin@localhost with a WARN.
# app.bootstrap-admin.username=
# app.bootstrap-admin.password=
# app.bootstrap-admin.email=

# Persistence: schema comes only from Flyway, never Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/{vendor}
spring.session.jdbc.initialize-schema=never

# Session cookie (HttpOnly, SameSite=Lax): Secure everywhere except dev (see application-dev.properties).
app.session.cookie-secure=true
# Most Sessions one Account may hold at once; a new login ends the oldest beyond this.
app.session.max-concurrent-per-account=1
# A Session ends after this long unused, and this long after login however busy (read from the Clock).
app.session.idle-timeout=15m
app.session.absolute-timeout=8h
# Stored row lifetime for Visitor Sessions (CSRF token only). Session control extends an
# authenticated Session's row to the absolute timeout, so the app itself detects and audits idle
# expiry (session-end) instead of the row silently disappearing first.
spring.session.timeout=${app.session.idle-timeout}

# Never leak internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

spring.h2.console.enabled=false

# Metrics (story 111): Actuator listens on its own port, bound to the loopback address, so it is
# unreachable from off the host however the network is configured and cannot be routed publicly by
# accident. The README's deployment note says it must never be routed publicly all the same.
# The API port is unaffected: it serves no Actuator endpoint, and its filter chain and public paths
# are unchanged.
# Trade-off: a loopback binding means the scraper and the health check must run on the same host (or
# in the same network namespace). A container platform that probes from outside the container has to
# widen this to 0.0.0.0 and keep the port off every public route and ingress instead.
management.server.port=9090
management.server.address=127.0.0.1
# Nothing is reachable unless named here: only health (status only) and prometheus, and only to read.
management.endpoints.access.default=none
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.access=read-only
management.endpoint.prometheus.access=read-only
# No links page either, so the management port answers on exactly the two paths above.
management.endpoints.web.discovery.enabled=false
# health answers with the status and nothing else: no component, no detail, and no liveness or
# readiness probe, whose groups would otherwise be listed in the response and served as extra paths.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
# Latency percentiles for request timing, on top of the count and sum Micrometer always exports.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# prometheus answers only to the scraper's HTTP Basic credential (IM8 as-13); health stays open. The
# password is injected from the secrets manager, never committed. Unset, every scrape is refused (401).
app.management.prometheus.username=prometheus
# app.management.prometheus.password=
