# Suppress verbose startup logs during mvn verify (integration-test phase)
logging.level.root=WARN
spring.main.banner-mode=off

# JPA / Hibernate — recreate schema on each startup (H2 in-memory)
spring.jpa.hibernate.ddl-auto=create-drop

# Cloud profiles must supply the admin password; local and test may start without an admin.
app.admin.password-required=false
