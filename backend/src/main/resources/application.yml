spring:
  application:
    name: hello-world-auth-app

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Real deployments must sit behind HTTPS (required for Secure
        # cookies); local dev runs over HTTP, so this is overridden to
        # false in the dev profile below.
        secure: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:hello-world-auth-app;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false
