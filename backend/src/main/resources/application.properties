spring.application.name=auth-app

spring.profiles.active=prod

# Datasource (url/driver-class-name) is set per-profile, not here -- see
# application-dev.properties / application-prod.properties. PRD: "H2 to start
# (dev profile), schema portable to Postgres/MySQL later"; keeping it
# profile-specific now means swapping prod to a real database later only
# touches application-prod.properties.

# JPA / Hibernate: schema managed by Hibernate. AdminBootstrapRunner seeds
# the initial ADMIN account on startup, replacing the old data.sql seed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sessions: Spring Session JDBC (ADR-0009), cookie name SESSION (HttpOnly;
# SameSite/Secure per profile). App-Standards Standalone auth track: 15-minute
# idle timeout (Spring Session's maxInactiveInterval); the 8-hour absolute
# lifetime is enforced by AbsoluteSessionTimeoutFilter.
server.servlet.session.timeout=15m
spring.session.jdbc.table-name=SPRING_SESSION
# Expired rows are purged by Spring Session's scheduled cleanup (default every minute).

# --- Logging (App-Standards LOG, ADR-0011) ---
# ECS JSON on the console; audit events go to the AUDIT logger with ECS fields
# (event.action/outcome/reason, user.id = users.public_id UUID, source.ip,
# session.hash, correlation.id) and trace.id/span.id from Micrometer Tracing.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
# Trace ids are for log correlation only: no span exporter is configured, so
# sampling everything costs nothing but in-process bookkeeping.
management.tracing.sampling.probability=1.0
# Micrometer puts traceId/spanId in MDC; emit them under their ECS names.
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id

# --- Password hashing / lockout / rate limits / reset token TTL ---
# Identical across dev and prod; only CORS origins, the frontend base URL, admin
# bootstrap credentials, the H2 console, cookie security attributes, and
# forwarded-header trust vary by profile (see application-dev.properties / application-prod.properties).
# BCrypt cost (App-Standards UAC; ADR-0006).
app.security.password.bcrypt-strength=12
# Account lockout (App-Standards UAC 3.5): 5 consecutive failures -> 20 minutes.
app.security.lockout.max-attempts=5
app.security.lockout.duration=20m
app.security.password-reset.token-ttl=30m

# Rate limits (ADR-0005). In-memory, per instance; every 429 carries Retry-After.
# block=0s (the default) means "blocked until the window ends".
app.security.rate-limit.max-keys=10000
# Login failures per source IP (password spray): 20 per 15 min -> blocked 15 min.
app.security.rate-limit.login-ip.max-hits=20
app.security.rate-limit.login-ip.window=15m
app.security.rate-limit.login-ip.block=15m
# Login failures per (IP, username): 3 per 15 min, i.e. before the account lock
# at 5 -- one source can't lock someone else out (PRD Story 3).
app.security.rate-limit.login-ip-username.max-hits=3
app.security.rate-limit.login-ip-username.window=15m
# Login attempts per username (App-Standards: 10 per account per minute).
app.security.rate-limit.login-username.max-hits=10
app.security.rate-limit.login-username.window=1m
app.security.rate-limit.register-ip.max-hits=10
app.security.rate-limit.register-ip.window=1h
app.security.rate-limit.reset-request-ip.max-hits=5
app.security.rate-limit.reset-request-ip.window=15m
# Per email: past this, requests are silently dropped (no email, still 200).
app.security.rate-limit.reset-request-email.max-hits=3
app.security.rate-limit.reset-request-email.window=15m
app.security.rate-limit.reset-confirm-ip.max-hits=10
app.security.rate-limit.reset-confirm-ip.window=15m
