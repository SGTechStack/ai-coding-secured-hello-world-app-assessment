# Production assumptions: served over HTTPS behind a TLS-terminating proxy, Postgres database.
server.servlet.session.cookie.secure=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The schema is created by hand/migrations in prod, never auto-altered by Hibernate.
# Spring Session's JDBC tables are still created on startup (initialize-schema=always in the base config).
spring.jpa.hibernate.ddl-auto=validate

app.allowed-origins=${APP_ALLOWED_ORIGINS}
