spring:
  application:
    name: secured-hello-world-backend

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true

app:
  frontend:
    origin: http://localhost:3000
  admin:
    username: admin
    password: ChangeMe123456!
  security:
    lockout:
      max-attempts: 5
      duration-minutes: 15
    ip-throttle:
      max-attempts: 20
      window-minutes: 15
    password-reset:
      token-expiry-minutes: 30
