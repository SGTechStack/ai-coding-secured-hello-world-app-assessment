# --- Prod profile ---
# A real deployment: frontend and backend on sibling subdomains of one site over
# HTTPS (e.g. app.example.com + api.example.com) -- still separate origins, so
# CORS applies exactly as in dev, but same-site, so the SESSION cookie can be
# SameSite=Strict + Secure (stricter than App-Standards' Lax; spec D9). Hosting them on unrelated domains would make
# every API call cross-site and Strict would drop the cookies.

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME}

server.servlet.session.cookie.same-site=Strict
server.servlet.session.cookie.secure=true

# Prod sits behind a TLS-terminating proxy/load balancer. Tomcat's RemoteIpValve
# honours X-Forwarded-For/-Proto only when the direct peer matches TRUSTED_PROXIES
# (a Java regex of proxy addresses, e.g. 10\\.0\\.0\\.\\d+), resolving the
# client IP right-to-left through trusted hops only. A request that doesn't come
# from a trusted proxy keeps its real peer address, so clients can't spoof their
# IP past the rate limits. Dev has no proxy, so it's off there.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES}

# Spring Session tables are not created in prod: apply Spring Session's
# schema-<platform>.sql (shipped in spring-session-jdbc) with the rest of the
# schema before first start (ADR-0009).
spring.session.jdbc.initialize-schema=never

# No defaults: these must be supplied via real environment/secrets for an actual
# deployment. Left unresolved, startup fails fast rather than silently falling back
# to a dev-shaped value in a live environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}
