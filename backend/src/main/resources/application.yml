# Secure defaults. Local development relaxes some of them in application-dev.yml.
spring:
  application:
    name: eitri
    version: ${APP_VERSION:0.0.1-SNAPSHOT}
  session:
    timeout: ${app.security.session.idle-timeout}
    jdbc:
      initialize-schema: never # Flyway owns the standard Spring Session JDBC tables.
      flush-mode: immediate # Make controller-based concurrent-session replacement visible before its lock releases.
  # No fallback in-memory user with a generated, logged password: accounts come from the app's own UserDetailsService.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Dev-only, self-contained database: in-memory H2, rebuilt by Flyway on every start.
  datasource:
    url: jdbc:h2:mem:eitri;DB_CLOSE_DELAY=-1
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway (src/main/resources/db/migration)

app:
  observability:
    audit:
      path: ${AUDIT_LOG_PATH:logs/audit.ndjson}
      max-file-size: ${AUDIT_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${AUDIT_LOG_MAX_HISTORY:7}
  api:
    base-path: /api/v1 # {base} of every API endpoint, used by controllers and SecurityConfig
  # Initial admin, created only while no ADMIN account exists. No defaults: startup fails without them then.
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  password-reset:
    token-lifetime: 30m
    # Origin of the SPA that serves /reset-password; required from the deployment environment.
    link-base-url: ${PASSWORD_RESET_LINK_BASE_URL}
  security:
    # Required from the deployment environment; dev and test profiles use non-production placeholders.
    session-hash-key: ${SESSION_HASH_KEY}
    # SPA origins allowed to call the API with credentials. None by default.
    cors:
      allowed-origins: []
    session:
      idle-timeout: 15m
      absolute-lifetime: 8h
      maximum-sessions: 1
    login:
      # Consecutive failures that lock an account, and for how long. The failures must fall within
      # lockout-window of the first one; older runs are forgotten.
      lockout-threshold: 5
      lockout-duration: 15m
      lockout-window: 15m
      # Failed logins one source IP may make within the window before it gets 429.
      ip-throttle-max-failures: 20
      ip-throttle-window: 15m
      ip-throttle-cache-bound: 10000
    # Roles are the fixed USER/ADMIN enum; an unknown role here fails startup.
    authorization:
      matrix:
        - role: USER
          permissions:
            - method: GET
              path: ${app.api.base-path}/auth/me
            - method: GET
              path: ${app.api.base-path}/hello
        - role: ADMIN
          permissions:
            - method: GET
              path: ${app.api.base-path}/auth/me
            - method: GET
              path: ${app.api.base-path}/hello
            - method: GET
              path: ${app.api.base-path}/admin/users
            - method: PATCH
              path: ${app.api.base-path}/admin/users/*/status
            - method: PATCH
              path: ${app.api.base-path}/admin/users/*/role
            - method: DELETE
              path: ${app.api.base-path}/admin/users/*

server:
  port: 8080
  # Honor X-Forwarded-For/-Proto only when the TCP peer is a trusted proxy (Tomcat's RemoteIpValve), so
  # HSTS and the per-IP login throttle work behind a TLS-terminating edge while a client that reaches the
  # app directly can't forge its address or claim HTTPS. Only loopback is trusted by default; a
  # deployment sets its edge's addresses as a regex through SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1'
  servlet:
    session:
      timeout: ${app.security.session.idle-timeout}
      cookie:
        http-only: true
        same-site: lax
        secure: true

# JSON (Elastic Common Schema) log lines for log aggregation.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${spring.application.version}
        environment: ${APP_ENVIRONMENT:local}
    json:
      customizer:
        - com.eitri.audit.SensitiveLogValueMasker

management:
  # The tracing starter also contributes an OTLP metrics registry; keep this trace/log-only baseline offline.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      type: w3c
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
