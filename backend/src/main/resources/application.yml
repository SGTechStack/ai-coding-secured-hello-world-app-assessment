spring:
  datasource:
    url: jdbc:h2:mem:hellodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # secure: true in production (requires HTTPS)
        secure: false
      timeout: 30m

app:
  cors:
    allowed-origin: "http://localhost:3000"
  admin:
    username: "admin"
    password: "ChangeMeAdmin123!"
    email: "admin@example.com"
  security:
    lockout:
      max-attempts: 5
      cooldown-minutes: 15
    ip-throttle:
      max-attempts: 20
      window-minutes: 15
    reset-token:
      expiry-minutes: 30

logging:
  level:
    com.assessment: INFO
