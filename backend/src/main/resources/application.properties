spring.application.name=authapp
server.port=8080

# --- Persistence (H2 in-memory for dev; schema is portable to Postgres/MySQL) ---
# (no url set: Boot auto-configures an embedded in-memory H2 with a unique name)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Server-side sessions (Spring Session JDBC) ---
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Overridden to true in the prod profile (requires HTTPS).
server.servlet.session.cookie.secure=false

# --- Application settings ---
app.allowed-origins=http://localhost:3000
app.lockout.max-attempts=5
app.lockout.cooldown-minutes=15
app.ip-throttle.max-failures=10
app.ip-throttle.window-minutes=15
app.password-reset.token-ttl-minutes=30

# Initial admin, seeded only when no ADMIN exists. No default password is shipped:
# set APP_ADMIN_PASSWORD (min 12 chars) or the seed is skipped.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:}
