spring:
  datasource:
    url: jdbc:h2:mem:helloworldauth;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Portable DDL: avoid H2-only dialect features so schema moves to Postgres/MySQL.
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Secure is bound to the prod profile (see application-prod.yml); dev runs over HTTP.
        secure: false

app:
  cors:
    frontend-origin: http://localhost:3000
