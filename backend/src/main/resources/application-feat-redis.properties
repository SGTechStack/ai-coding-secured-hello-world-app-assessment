# No @RedisHash entities exist — Redis here backs the cache manager (RedisCacheManager),
# HTTP session (spring-session-data-redis / RedisIndexedSessionRepository), and the JWKS
# rotation lock (StringRedisTemplate). None of those use Spring Data Redis *repository*
# scanning, so leaving it on only makes the scanner probe every JPA @Repository and log a
# "Could not safely identify store assignment" warning for each. Off = no scan, no noise.
spring.data.redis.repositories.enabled=false

# Connection details come from the APP_CONFIG_TF_SECRET_NAME import (redis_host/redis_port —
# Terraform-derived, kept in sync every apply; see application-feat-aws-secrets.properties and
# the ElastiCache module in terraform). Placeholders default to empty/6379 so an env without
# these secrets populated yet doesn't fail property resolution.
# ElastiCache Serverless (Valkey) is TLS-only, so SSL is always on for this profile.
spring.data.redis.host=${redis_host:}
spring.data.redis.port=${redis_port:6379}
spring.data.redis.ssl.enabled=true
