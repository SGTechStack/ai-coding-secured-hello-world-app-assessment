# Trust X-Forwarded-For from the cloud load balancer (AWS ALB) in dev / qa / preprod / prod.
#
# Without this, the servlet remote address is the load balancer's, so the per-IP sign-in throttle
# (SignInIpThrottle) would treat every client as one address.
#
# TRUST ASSUMPTION: "native" makes Tomcat's RemoteIpValve rewrite the remote address from
# X-Forwarded-For, but only when the direct peer matches its internal-proxies pattern (Tomcat
# default: private ranges such as 10/8, 172.16/12, 192.168/16, loopback). That is safe only while
# the app is reachable solely through the load balancer inside the VPC. Never enable this profile
# where clients can reach Tomcat directly: they could spoof any address and evade the throttle.
# Not part of local or test, where there is no proxy.
server.forward-headers-strategy=native
