# Runtime self-signed TLS certificate generated via keytool at startup by SelfSignedSslConfig.
#
# Local: Tomcat serves HTTPS on port 8443 with the self-signed cert. Browsers will show a
#        warning which must be accepted once; this is expected for local development.
#
# dev / qa / preprod / prod: An AWS ALB terminates TLS with a CA-signed certificate and forwards traffic
#        to Tomcat over HTTPS using the self-signed cert. ALB does not verify the backend
#        certificate by default, so the self-signed cert is accepted without additional trust
#        configuration. End-users only ever see the CA-signed certificate on the ALB.

# HTTPS on 8443; served with the self-signed cert generated at startup by SelfSignedSslConfig.
server.port=8443

# CIS 5.2/5.3 – Mark session cookies as Secure so they are never sent over plain HTTP.
server.servlet.session.cookie.secure=true

# CIS 5.5/5.6 and CIS 5.7 (protocol allowlist and cipher suite allowlist) are enforced
# programmatically in SelfSignedSslConfig.java so the constraints are always applied
# regardless of property file ordering or profile resolution.
