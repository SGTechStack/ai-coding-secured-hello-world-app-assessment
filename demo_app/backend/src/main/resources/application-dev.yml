# Local development over plain HTTP (`mvn spring-boot:run` selects this profile).
spring:
  flyway:
    # Adds the demo account (johndoe) on top of the schema migrations.
    locations: classpath:db/migration,classpath:db/seed

server:
  servlet:
    session:
      cookie:
        # http://localhost cannot carry a Secure cookie reliably across browsers.
        secure: false

logging:
  structured:
    format:
      # Human-readable console for local runs; every other profile logs ECS JSON.
      console: ""

app:
  cors:
    # The Vite dev server. Production has no default: set APP_CORS_ALLOWED_ORIGINS.
    allowed-origins: http://localhost:3000
  # The Vite dev server; reset links point here.
  frontend-url: http://localhost:3000
