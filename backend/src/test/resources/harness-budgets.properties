# Raised rate-limit budgets for the shared test contexts (ctx-default, ctx-port, ctx-locktimeout).
#
# Those contexts are shared by the whole suite, the limiter's state lives as long as the context, and MockMvc and the
# port client all arrive from one loopback source key on a clock that tests rarely move. With application.yml's
# budgets the suite's own fixture traffic (token bootstraps, sign-ins, stale session cookies) would spend the loopback
# source's budgets and fail unrelated tests. The budgets are raised here, through their own properties, rather than
# bypassed in code: the limiter still runs on every request, with the same refill periods.
#
# Tests of the budgets themselves extend CtxBudgetTest, which does not load this file and so runs on application.yml's
# values. A new route's budget row that fixtures hit repeatedly is raised here in the same way.
app.security.rate-limit.login.source.burst=1000000
app.security.rate-limit.login.username.burst=1000000
app.security.rate-limit.csrf.source.burst=1000000
app.security.rate-limit.profile-password.source.burst=1000000
app.security.rate-limit.register.source.burst=1000000
app.security.rate-limit.register-activate.source.burst=1000000
app.security.rate-limit.session-miss.capacity=1000000
# The lockout-cardinality axis (ADR-015): lockout tests in the shared contexts lock accounts from the one loopback
# source, which would fill its set and refuse every later test's fresh username. Its own tests run on CtxBudgetTest.
app.security.rate-limit.lockout-cardinality.k=1000000
