# Suppress verbose startup logs during mvn verify (integration-test phase)
logging.level.root=WARN
spring.main.banner-mode=off

# JPA / Hibernate — recreate schema on each startup (H2 in-memory)
spring.jpa.hibernate.ddl-auto=create-drop

# No real AWS SQS queue available in tests — the inbound-email listener would otherwise fail to
# start (its @SqsListener needs a non-blank queue name, and app.email.inbound.queue-name defaults
# to empty outside local/dev/qa/etc). See InboundEmailSqsListener's @ConditionalOnProperty.
app.email.inbound.enabled=false
app.email.domain=uc.demomcc.com

# Cloud profiles must supply the admin password; local and test may start without an admin.
app.admin.password-required=false
