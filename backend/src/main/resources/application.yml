spring:
  datasource:
    url: jdbc:h2:mem:helloworldauth;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Portable DDL: avoid H2-only dialect features so schema moves to Postgres/MySQL.
        format_sql: true
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Secure is bound to the prod profile (see application-prod.yml); dev runs over HTTP.
        secure: false

app:
  cors:
    frontend-origin: http://localhost:3000
  security:
    lockout:
      # Account lockout (ticket 07): Nth consecutive failure locks the account
      # for the cooldown by setting locked_until.
      max-attempts: 5
      cooldown-minutes: 15
    throttle:
      # IP-level throttle (ticket 07): failures from one client IP across any
      # usernames within the window; once exceeded the IP gets HTTP 429.
      max-failures: 10
      window-minutes: 15
