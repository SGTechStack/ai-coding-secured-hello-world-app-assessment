# Base (production) configuration. The `dev` profile is the only other posture; there is no `test` profile (ADR-067).
server:
  port: 8080
  # Explicit, so cloud-platform detection never installs a RemoteIpValve with Tomcat's RFC 1918 default. The only
  # forwarded-header trust is the one derived from app.security.client-ip (REJ-015; R-RL-007).
  forward-headers-strategy: none

spring:
  application:
    name: secured-hello-world
  datasource:
    # H2 file mode only; LOCK_TIMEOUT is pinned on the URL and FILE_LOCK=NO is prohibited.
    url: jdbc:h2:file:./data/secured-hello;LOCK_TIMEOUT=1000
  # Flyway owns the schema (V1-V7, append-only) and may never wipe it (REJ-041).
  flyway:
    clean-disabled: true
  # Hibernate only validates; the real schema gate is ADR-051's negative-test set.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # Column names in the database's metadata case, so NAMED validation has no false failures (T-CFG-006).
      naming:
        physical-strategy: sg.securedhello.persistence.MetadataCaseNamingStrategy
    properties:
      hibernate:
        tooling:
          schema:
            index_validation: NAMED
            unique_key_validation: NAMED
  # V7 creates the session tables from a verbatim copy; Spring Session never creates them (REJ-040; ADR-030).
  session:
    jdbc:
      initialize-schema: never

app:
  security:
    password:
      bcrypt-strength: 12
    # Authorization matrix (ADR-043). Each row names an explicit method and a path under /api. Applied as: whitelist,
    # then the fixed /api/admin/roles/** denyAll, then these role guards, then anyRequest().denyAll(). No row, no access.
    authorization:
      whitelist: []
      roles: {}
    # Source keys (ADR-020). The client address is the socket peer unless source=proxy, which needs
    # trusted-proxies to name each proxy address; trusted-proxies has no default (R-RL-007).
    client-ip:
      source: socket
      ipv6-prefix-length: 64
  # The audit stream (ADR-055; ADR-056). The directory holds the dedicated audit file, read by logback-spring.xml.
  audit:
    directory: logs
    url-path:
      # Raw URIs on pre-handler rows are capped here, marker included (REJ-081).
      max-length: 256

# Actuator: health only, read-only, no details; everything else is denied (ADR-061).
# Values equal to Boot's defaults are still written, because im8-review greps for the exposure property.
management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health
    jmx:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      # No liveness/readiness probes or db indicator (REJ-063).
      probes:
        enabled: false
  health:
    db:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  # Inbound trace context is restarted by TraceContextRestartFilter (ADR-063). Baggage is off (REJ-087). There is no
  # trace exporter.
  tracing:
    baggage:
      enabled: false

# ECS service fields on every log line (LOG §5). The format itself is set in logback-spring.xml.
logging:
  structured:
    ecs:
      service:
        name: secured-hello-world
        version: "@project.version@"
