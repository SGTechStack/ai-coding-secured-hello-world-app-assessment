spring:
  application:
    name: secured-hello
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/hello}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: none
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${APP_COOKIE_SECURE:true}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} %kvp - %msg%n"
