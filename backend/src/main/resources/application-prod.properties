# --- Prod profile ---
# A real deployment: frontend and backend on sibling subdomains of one site over
# HTTPS (e.g. app.example.com + api.example.com) -- still separate origins, so
# CORS applies exactly as in dev, but same-site, so the session and CSRF cookies
# can be SameSite=Strict + Secure. Hosting them on unrelated domains would make
# every API call cross-site and Strict would drop the cookies.

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=${DATABASE_DRIVER_CLASS_NAME}

server.servlet.session.cookie.same-site=Strict
server.servlet.session.cookie.secure=true

# Prod sits behind a TLS-terminating proxy/load balancer: trust its
# X-Forwarded-Proto/-For so the app sees the original https scheme and the real
# client IP (which the login IP throttle keys on). Prod-only: requires the app to
# be reachable solely through a proxy that overwrites these headers -- otherwise
# clients could spoof their IP past the throttle. Dev has no proxy, so it's off.
server.forward-headers-strategy=framework

# No defaults: these must be supplied via real environment/secrets for an actual
# deployment. Left unresolved, startup fails fast rather than silently falling back
# to a dev-shaped value in a live environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}
# Parent domain for the XSRF-TOKEN cookie (e.g. .example.com), so the SPA on its
# own subdomain can read it. Set it to an empty value only if frontend and
# backend are served from a single origin.
app.csrf.cookie-domain=${CSRF_COOKIE_DOMAIN}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}
