# Base (production) configuration. The `dev` profile is the only other posture; there is no `test` profile (ADR-067).
server:
  port: 8080
  # Explicit, so cloud-platform detection never installs a RemoteIpValve with Tomcat's RFC 1918 default. The only
  # forwarded-header trust is the one derived from app.security.client-ip (REJ-015; R-RL-007).
  forward-headers-strategy: none
  # The request thread pool is pinned, and its saturation is metered: Tomcat publishes its thread meters only with its
  # MBean registry on (TM-07; R-RL-005). Hikari meters its pool by default.
  tomcat:
    threads:
      max: 200
    mbeanregistry:
      enabled: true
  servlet:
    session:
      # The one cookie (ADR-058; REJ-061): SameSite=Strict, not the governing standard's Lax, by decision. No Domain and
      # no Max-Age (REJ-008). The __Host- prefix needs Secure and Path=/; dev overrides the name and Secure.
      cookie:
        name: __Host-SESSION
        http-only: true
        secure: true
        same-site: strict
        path: /

spring:
  application:
    name: secured-hello-world
  # Secrets come from the environment or from files mounted under /run/secrets, never from a committed file (ADR-062;
  # R-CFG-013). A local .env file, never committed, is read first, so a mounted secret file wins over it (T-CFG-021).
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:configtree:/run/secrets/"
  datasource:
    # H2 file mode only; LOCK_TIMEOUT is pinned on the URL and FILE_LOCK=NO is prohibited.
    url: jdbc:h2:file:./data/secured-hello;LOCK_TIMEOUT=1000
  # Flyway owns the schema (V1-V7, append-only) and may never wipe it (REJ-041).
  flyway:
    clean-disabled: true
  # Hibernate only validates; the real schema gate is ADR-051's negative-test set.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      # Column names in the database's metadata case, so NAMED validation has no false failures (T-CFG-006).
      naming:
        physical-strategy: sg.securedhello.persistence.MetadataCaseNamingStrategy
    properties:
      hibernate:
        tooling:
          schema:
            index_validation: NAMED
            unique_key_validation: NAMED
  # V7 creates the session tables from a verbatim copy; Spring Session never creates them (REJ-040; ADR-030).
  session:
    # W, the idle window. Set here, not as server.servlet.session.timeout, which Boot ignores outside an embedded
    # server (a MOCK test context). Anonymous sessions also expire W after creation (REJ-091).
    timeout: 15m
    jdbc:
      initialize-schema: never
      # Spring Session's default, pinned: the per-source row figures assume a one-minute sweep (R-SES-011).
      cleanup-cron: "0 * * * * *"

app:
  security:
    # The role set, the source of truth (ADR-042): two roles, one per user. The seeded roles table must hold exactly
    # these; startup refuses a duplicate or a disagreement (RoleDefinitions).
    roles:
      - USER
      - ADMIN
    password:
      bcrypt-strength: 12
      # The policy PasswordService runs on every password set (ADR-002; ADR-003; ADR-005; REJ-007).
      min-length: 15
      max-bytes: 72
      min-strength-score: 3
      history-length: 3
    # Authorization matrix (ADR-043). Each row names an explicit method and a path under /api. Applied as: whitelist,
    # then the fixed /api/admin/roles/** denyAll, then these role guards, then anyRequest().denyAll(). No row, no access.
    authorization:
      whitelist:
        # The CSRF token bootstrap, the only route that creates an anonymous session (ADR-040).
        - method: GET
          path: /api/csrf
        # Sign-in and sign-out (SignIn). Their filters answer before authorization; the rows record them here.
        - method: POST
          path: /api/login
        - method: POST
          path: /api/logout
        # Two-step self-registration (ADR-032).
        - method: POST
          path: /api/register
        - method: POST
          path: /api/register/activate
        # Password reset: request by email address, and redemption of a user- or admin-issued token (PRD Story 6).
        - method: POST
          path: /api/password-reset/request
        - method: POST
          path: /api/password-reset/confirm
      roles:
        USER:
          - method: GET
            path: /api/profile
          - method: GET
            path: /api/hello
          # Self-service change and forced-change completion (ADR-008).
          - method: PATCH
            path: /api/profile/password
        ADMIN:
          # The self-read needs the password only, not the second factor (ADR-043). /api/hello is ROLE_USER only.
          - method: GET
            path: /api/profile
          - method: PATCH
            path: /api/profile/password
          # TOTP enrolment, reachable with no factor: outside /api/admin/**, off the forced-change allowlist (ADR-023).
          - method: POST
            path: /api/mfa/totp/enrolment
          - method: POST
            path: /api/mfa/totp/enrolment/confirmation
          # Factor verification: grants or renews FACTOR_TOTP; the password factor is enough to reach it (ADR-021).
          - method: POST
            path: /api/mfa/totp/verification
          # The admin surface. Every /api/admin/** row also requires the second factor, after the role (ADR-026).
          - method: GET
            path: /api/admin/users
          - method: GET
            path: /api/admin/users/{id}
          # Enable or disable, through AdminActionGuard (ADR-048). A mutation: the factor must be under 10 minutes old.
          - method: PUT
            path: /api/admin/users/{id}/enabled
          # Admin credential issuance and unlock (ADR-006; REJ-072). Mutations: the factor must be under 10 minutes old.
          - method: POST
            path: /api/admin/users
          - method: POST
            path: /api/admin/users/{id}/password-reset
          - method: POST
            path: /api/admin/users/{id}/unlock
          # Role change and delete (with its tombstone), through AdminActionGuard (ADR-048; ADR-044). Mutations.
          - method: PUT
            path: /api/admin/users/{id}/role
          - method: DELETE
            path: /api/admin/users/{id}
          # Factor reset, guarded but exempt from the two-admin count (ADR-049). A mutation: factor under 10 minutes.
          - method: DELETE
            path: /api/admin/users/{id}/totp
    # A signed-in session ends this long after its AUTH_INSTANT, whatever its traffic (REJ-012; ADR-038).
    session:
      absolute: 8h
      # New anonymous sessions are shed while free space on the database volume is under k x N x b + floor
      # (ADR-041). N_max, k and b are planning values in code, not settings.
      shedding:
        floor: 256MB
    # Source keys (ADR-020). The client address is the socket peer unless source=proxy, which needs
    # trusted-proxies to name each proxy address; trusted-proxies has no default (R-RL-007).
    client-ip:
      source: socket
      ipv6-prefix-length: 64
    # The budget table (ADR-010; ADR-017), the one place its values live: <route>.<axis>.burst requests at once, then
    # one more per refill-period. A route ticket adds its row here and one RateLimit constant (see AuthRateLimiter).
    # Every refusal is 429 TOO_MANY_REQUESTS with an integer Retry-After. In memory, single instance (REJ-018).
    rate-limit:
      login:
        source:
          burst: 60
          refill-period: 1s
        username:
          burst: 10
          refill-period: 6s
      csrf:
        source:
          burst: 30
          refill-period: 2s
      profile-password:
        source:
          burst: 10
          refill-period: 6s
      register:
        source:
          burst: 5
          refill-period: 12s
      register-activate:
        source:
          burst: 10
          refill-period: 6s
      password-reset-request:
        source:
          burst: 5
          refill-period: 12s
        identifier:
          burst: 3
          refill-period: 20m
      password-reset-confirm:
        source:
          burst: 10
          refill-period: 6s
      mfa-totp-enrolment:
        source:
          burst: 10
          refill-period: 6s
      mfa-totp-enrolment-confirmation:
        source:
          burst: 20
          refill-period: 3s
      mfa-totp-verification:
        source:
          burst: 20
          refill-period: 3s
      # Session-store lookups that did not resolve, per source, on every route (ADR-017).
      session-miss:
        capacity: 300
        window: 15m
      # Not a budget row: the distinct accounts one source may drive into lockout, each held for a window from its
      # first lockout (ADR-015). Past k, that source's sign-ins for any other username get 429.
      lockout-cardinality:
        k: 5
        window: 1h
    # Password lockout (ADR-011; ADR-012) and the NIST cap (ADR-013). threshold failures inside observation-window
    # lock the account for a rung, cycles-per-rung locks per rung, read from the cap counter; the lock lifts on its
    # own. So does the consecutive-threshold-th failure since the last success, whatever the window, and every
    # threshold-th failure after it, so paced failures still climb the ladder. cap failures since the last success
    # disable the password until it is rebound, with an alert at alert-threshold. Startup refuses values that let an
    # attack of any pacing disable in under 840 minutes or leave under 580 of warning.
    lockout:
      threshold: 5
      observation-window: 20m
      consecutive-threshold: 10
      ladder:
        rungs: 20m, 40m, 60m
        cycles-per-rung: 5
      nist:
        cap: 100
        alert-threshold: 50
    request:
      # Counted in bytes as the body is read, before the login converter parses it (Std §5:494).
      max-body-bytes: 16384
  mfa:
    totp:
      # The service name an authenticator app shows beside the account. Not a secret; required and never blank.
      issuer: Secured Hello World
  # The audit stream (ADR-055; ADR-056). The directory holds the dedicated audit file, read by logback-spring.xml.
  audit:
    directory: logs
    url-path:
      # Raw URIs on pre-handler rows are capped here, marker included (REJ-081).
      max-length: 256
    # Keyed rows (ADR-019; REJ-080): tier 1 keyed by source, tier 2 by user, each written once per key, row, reason
    # and window with its count; past a tier's cap, one truncation row per window. Tunable; changing them moves the
    # daily audit volume (R-AUD-030).
    keying:
      window: 15m
    truncation:
      distinct-sources: 20
      distinct-users: 500

# Actuator: health only, read-only, no details; everything else is denied (ADR-061).
# Values equal to Boot's defaults are still written, because im8-review greps for the exposure property.
management:
  endpoints:
    access:
      default: none
      max-permitted: read-only
    web:
      exposure:
        include: health
    jmx:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      # No liveness/readiness probes or db indicator (REJ-063).
      probes:
        enabled: false
      # The shed episode's h2Data indicator is kept out of /actuator/health, so a shed never makes the endpoint a
      # load balancer polls return 503; /actuator/health/storage reports it, also detail-free (ADR-041).
      group:
        storage:
          include: h2Data
  health:
    db:
      enabled: false
    # The disk-space indicator watches the audit directory; the deployer computes its threshold (R-OBS-012). The
    # database volume is watched by the h2Data indicator in the storage group, which shares the shed check's state.
    diskspace:
      path: ${app.audit.directory}
  otlp:
    metrics:
      export:
        enabled: false
  # Inbound trace context is restarted by TraceContextRestartFilter (ADR-063). Baggage is off (REJ-087). There is no
  # trace exporter.
  tracing:
    baggage:
      enabled: false

# ECS service fields on every log line (LOG §5). The format itself is set in logback-spring.xml.
logging:
  structured:
    ecs:
      service:
        name: secured-hello-world
        version: "@project.version@"
        # service.environment on every line (LOG §5:347); the dev profile overrides it.
        environment: production
