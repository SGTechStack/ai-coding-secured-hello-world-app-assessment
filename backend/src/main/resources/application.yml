spring:
  application:
    name: secured-hello-world
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
  h2:
    console:
      enabled: false

server:
  port: 8080
  servlet:
    session:
      timeout: 30m          # explicit idle timeout; default is 30m but pinned here (Story 53)
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: false        # local dev over HTTP; prod must set true (behind HTTPS)
  error:
    include-stacktrace: never   # never leak internal stacktraces (Story 53)
    include-message: never      # never echo exception messages that may contain sensitive data
    include-binding-errors: never
    include-exception: false

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  # Frontend base URL used to build password-reset links.
  # Reset links are NEVER built from the request Host header (Story 52).
  frontend:
    base-url: http://localhost:3000
  security:
    lockout:
      max-attempts: 5
      duration-minutes: 15
    ip-throttle:
      max-attempts: 20
      window-minutes: 15
  # Initial admin seed. The shipped password is a KNOWN PLACEHOLDER: it works for
  # local/dev startup only. Under any non-dev profile the bootstrap refuses to seed
  # with a placeholder and fails fast — a real password must meet the full policy
  # (length 12-72, 3-of-4 character categories) and be supplied via config
  # (e.g. APP_ADMIN_PASSWORD env var). See Story 51.
  admin:
    username: admin
    email: admin@example.com
    password: change-me-please-12+  # dev placeholder — lower+special+digit = 3 categories
  # Password reset token lifetime + per-IP request rate limit
  reset:
    token-ttl-minutes: 30
    request-rate-limit:
      max-attempts: 5
      window-minutes: 15

logging:
  level:
    root: INFO
