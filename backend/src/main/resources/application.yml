spring:
  application:
    name: hello-world-auth-app
  flyway:
    # Schema is owned by versioned migrations, not by Hibernate. Enabled by
    # default so a deployment cannot accidentally run without them; the dev
    # profile below turns it off, because dev uses an in-memory H2 that is
    # recreated from the entity model on every boot and has no schema to
    # migrate.
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  # This governs the framework's own view of the request. The throttle's view
  # is configured separately via app.security.trusted-proxy-hops; both default
  # to "assume no proxy" for the same reason.
  #
  # Honouring X-Forwarded-* is required behind a TLS-terminating proxy, or
  # the app cannot tell whether the original request was secure and
  # requiresHttps/HSTS/Secure-cookies all misfire. It is left OFF by default
  # on purpose: if the app is reachable directly, a client can forge
  # X-Forwarded-Proto: https and defeat exactly those controls. Set this to
  # `framework` only when every route to the app passes through a proxy you
  # trust to overwrite the header.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    # Caps on what an unauthenticated caller can make this process spend. The
    # body limit is enforced by MaxRequestSizeFilter rather than here, because
    # max-http-form-post-size only covers form-encoded bodies and every endpoint
    # on this API takes JSON.
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    max-http-request-header-size: 16KB
    threads:
      max: 100
    max-connections: 2000
    accept-count: 100
  servlet:
    session:
      # Idle timeout. Was previously unset, which meant an implicit 30-minute
      # container default that nobody had chosen. Paired with
      # app.security.session-absolute-timeout, which caps total lifetime.
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Real deployments must sit behind HTTPS (required for Secure
        # cookies); local dev runs over HTTP, so this is overridden to
        # false in the dev profile below.
        secure: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  logging:
    # Key used to derive the pseudonymous user references that appear in logs
    # and audit rows in place of usernames (see UserPseudonym).
    #
    # Unset by default, which means "generate one per boot". That is deliberate:
    # a fixed fallback baked into this file would be readable by anyone with the
    # repository, making every pseudonym reversible and the protection
    # decorative. The cost is that references do not survive a restart, so an
    # investigation spanning one cannot join across it — set this from a secret
    # manager if that matters.
    pseudonym-salt: ${APP_LOG_PSEUDONYM_SALT:}
  retention:
    # Retention is a policy decision expressed as configuration, so the period
    # in force is visible in a diff rather than buried in a scheduler.
    #
    # Reset-token rows are kept for this long past expiry or use, then deleted.
    # Not deleted on expiry: "did a reset happen on this account last week, and
    # was the link consumed" is a question that arises exactly when an account
    # turns out to have been compromised, and purging on expiry would destroy
    # the answer at the moment it became useful.
    reset-token-grace: ${APP_RESET_TOKEN_GRACE:P7D}
    purge-interval: ${APP_PURGE_INTERVAL:PT1H}
    # Keeps the sweep off the startup path, where it would compete with schema
    # setup and the admin bootstrap for the same connection pool to delete
    # nothing.
    purge-initial-delay: ${APP_PURGE_INITIAL_DELAY:PT5M}
    # Master switch for the scheduler. The test suite sets this false: a purge
    # firing on its own timetable inside an integration test is a background
    # thread deleting rows another test is asserting on.
    purge-enabled: ${APP_PURGE_ENABLED:true}
  privacy:
    # The notice shown at the point of collection and served from
    # GET /api/privacy-notice. Held here rather than as frontend copy so one
    # source of truth is testable, reusable by any client, and adjustable per
    # deployment — the lawful basis and the retention periods are exactly the
    # parts that differ by jurisdiction and operator.
    #
    # Drafted against general PDPA/GDPR-style expectations because the PRD
    # declares no regime. This is input to a compliance review, not its output;
    # see docs/adr/0005-personal-data-lawful-basis-and-retention.md.
    controller: ${APP_PRIVACY_CONTROLLER:Hello World Auth App (reference implementation)}
    contact: ${APP_PRIVACY_CONTACT:privacy@example.invalid}
    lawful-basis: >-
      Performance of a contract: the email address is required to operate the
      account it belongs to, specifically to deliver a password reset link at
      the account holder's request. It is used for nothing else — no marketing,
      no profiling, no disclosure to third parties.
    data-collected:
      - "Username — identifies the account at sign-in and in audit records."
      - "Email address — used solely to deliver a password reset link you ask for."
      - "Password — stored only as a BCrypt hash; the password itself is never stored or logged."
      - "Sign-in activity — failed attempt counts and lockout times, to detect and slow brute-force attacks."
    retention:
      - "Account data (username, email, password hash): kept until you erase the account."
      - "Password reset requests: deleted 7 days after the link expires or is used."
      - "Security and audit logs: retained 90 days, then deleted."
      - "Administrative audit records: retained 1 year for accountability, and identify accounts by a pseudonymous reference rather than by name."
    rights:
      - "Access — download everything held about your account from Account, Download my data."
      - "Erasure — delete your account and its data from Account, Delete my account."
      - "Rectification — change your password at any time; contact us to correct a username or email."
      - "Complaint — contact the address above."
    last-updated: ${APP_PRIVACY_LAST_UPDATED:2026-09-24}
  frontend:
    # Base URL the frontend is served from, used to build links that leave
    # the backend (e.g. the password reset link emailed to users). Defaults
    # to the dev frontend origin; must be overridden to the real deployed
    # frontend URL outside dev.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  admin:
    # Deliberately no defaults here. Both placeholders are unresolvable if
    # the environment does not supply them, so a deployment that forgets to
    # set admin credentials fails to start rather than booting with a
    # guessable account. The dev profile below relaxes this, but only as far
    # as a per-boot random password — never a fixed one.
    username: ${APP_ADMIN_USERNAME}
    password: ${APP_ADMIN_PASSWORD}
  security:
    # How many proxies sit between the internet and this application, used to
    # work out which address to throttle. 0 means "directly reachable", and
    # X-Forwarded-For is then ignored entirely because nothing can vouch for it
    # — a caller could otherwise rotate a fake value per request and never be
    # throttled. Set this to the real hop count behind a proxy, or every client
    # collapses into one throttle bucket and the tenth failed login from anyone
    # locks out everyone. Both failure modes are real; the topology has to be
    # declared rather than guessed.
    trusted-proxy-hops: ${APP_TRUSTED_PROXY_HOPS:0}
    # Transport security. When true the filter chain refuses plaintext
    # (requiresChannel -> requiresSecure) and CORS origins must be https.
    # Defaults to true so a deployment is secure unless it deliberately opts
    # out; the dev profile below sets it false, because local dev runs over
    # HTTP by documented agreement with the PRD.
    require-https: ${APP_REQUIRE_HTTPS:true}
    # HSTS max-age. Spring Security only emits the header on requests that
    # already arrived over HTTPS, so this is inert until TLS terminates in
    # front of the app.
    hsts-max-age: 365d
    # Hard ceiling on session lifetime, independent of idle timeout. Without
    # it a session kept warm by periodic activity lives forever, so a stolen
    # cookie stays valid for as long as the attacker keeps using it.
    session-absolute-timeout: 8h
    # Ceiling on request body size, refused up front from Content-Length before
    # anything buffers or parses it. Bean validation cannot serve this purpose:
    # @Size runs after Jackson has already materialised the whole payload. A
    # caller using chunked encoding sends no Content-Length, so this is a floor
    # rather than a guarantee — a hard ceiling belongs at the ingress, which can
    # enforce it while streaming.
    max-request-body-size: 64KB
    # This service answers with JSON and serves no scripts, styles or images
    # of its own, so the correct policy for its own responses is to permit
    # nothing. Note this does NOT protect the SPA: that is served from a
    # different origin and needs its own CSP at its own host.
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
    # Request-rate limits on unauthenticated write endpoints, counted per
    # caller per window. These count REQUESTS, not failures — unlike the login
    # throttle, which counts failures because a legitimate user logging in
    # repeatedly should never be limited. Registration and password reset have
    # no notion of failure: they succeed from the caller's point of view every
    # time, and what needs defending is the work each call performs anyway. Both
    # run a BCrypt hash (~100ms of server CPU for near-zero client effort), and
    # a reset request additionally writes a row and, once real mail is wired,
    # sends a message to somebody else's inbox.
    #
    # Login is absent here on purpose: IpLoginThrottle already covers it on the
    # more appropriate failure-counting basis.
    rate-limits:
      - name: register
        method: POST
        path: /api/auth/register
        max-requests: 10
        window: 1h
      - name: password-reset-request
        method: POST
        path: /api/auth/password-reset/request
        max-requests: 5
        window: 1h
      - name: password-reset-confirm
        method: POST
        path: /api/auth/password-reset/confirm
        max-requests: 10
        window: 1h
    # Configuration-owned RBAC (see
    # App-Standards/Appfw-User-Standards/Shared_Recipes/Common_Role-Based_Access_Control_Configuration.md).
    # This is the single source of truth for which role holds which
    # fine-grained authority, and which HTTP method+path each authority
    # guards. SecurityConfig's filter chain is built entirely from this
    # block; changing access to an endpoint means editing this file, not
    # Java.
    #
    # role-mappings: which authorities a role is entitled to. USER's
    # authorities are also reachable by ADMIN via the role-hierarchy
    # below, so ADMIN does not need HELLO_READ repeated here.
    # ADMIN_USER_EMAIL_READ is separate from ADMIN_USER_READ on purpose. Reading
    # the user list and reading somebody's actual email address are different
    # acts with different sensitivity, and splitting the authority means a future
    # read-only or support role can be granted the listing without the personal
    # data behind it. Both land on ADMIN today; the seam is what makes that
    # changeable without a code change.
    #
    # ACCOUNT_SELF_MANAGE sits on USER, and ADMIN reaches it through the role
    # hierarchy — an admin is a data subject too and has the same rights over
    # their own account.
    role-mappings:
      ADMIN: [ADMIN_USER_READ, ADMIN_USER_EMAIL_READ, ADMIN_USER_WRITE]
      USER: [HELLO_READ, ACCOUNT_SELF_MANAGE]
    # ROLE_ADMIN inherits every authority reachable by ROLE_USER, so an
    # admin can reach USER-guarded endpoints without USER's authorities
    # being duplicated into ADMIN's role-mapping above.
    role-hierarchy: "ROLE_ADMIN > ROLE_USER"
    # Authority -> the HTTP method+path pairs it guards. Every guarded
    # route must appear here exactly once; anything not covered by this
    # map or the whitelist below is denied by default.
    url-guards:
      HELLO_READ:
        - method: GET
          path: /api/hello
      ADMIN_USER_READ:
        - method: GET
          path: /api/admin/users
      # One account at a time, with a mandatory purpose and an audit row. This
      # replaced GET /api/admin/users returning every registered email address
      # in a single response.
      ADMIN_USER_EMAIL_READ:
        - method: GET
          path: /api/admin/users/*/email
      # Data-subject rights over the caller's own account. Neither route takes
      # an account id — the subject is always the authenticated principal — so
      # there is no parameter through which one user could reach another's data.
      ACCOUNT_SELF_MANAGE:
        - method: GET
          path: /api/account/export
        - method: DELETE
          path: /api/account
      ADMIN_USER_WRITE:
        - method: PATCH
          path: /api/admin/users/*/enabled
        - method: PATCH
          path: /api/admin/users/*/role
        - method: DELETE
          path: /api/admin/users/*
    # Routes reachable without authentication. Kept as small as possible:
    # only what a client needs before it has a session (registration,
    # login, the CSRF token endpoint, health, password reset).
    #
    # The H2 console is deliberately NOT here. It used to be, which meant
    # an unauthenticated full-SQL surface was whitelisted in every profile
    # on the argument that the servlet only exists in dev. The rule and the
    # servlet are now gated by the same thing: H2ConsoleSecurityConfig is
    # @Profile("dev"), so outside dev /h2-console/** is covered by neither
    # the whitelist nor a url-guard and is therefore denied by default.
    whitelist:
      - /api/auth/register
      # The privacy notice has to be readable before an account exists: the
      # person deciding whether to hand over an email address has not registered
      # yet. It describes the processing and contains no personal data.
      - /api/privacy-notice
      - /api/health
      - /api/csrf
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/password-reset/request
      - /api/auth/password-reset/confirm

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:hello-world-auth-app;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    # Off in dev. The dev datasource is an in-memory H2 that is created from the
    # entity model on every boot and discarded on shutdown, so there is no
    # schema with a history to migrate. The migrations are written for the
    # production engine; running them against H2 would mean either constraining
    # them to the intersection of two SQL dialects or maintaining two sets.
    #
    # The cost is that dev does not exercise the migrations, so a migration can
    # be wrong in a way dev cannot reveal. That is the reason
    # FlywayMigrationTest asserts the checked-in migration matches the entity
    # model, and the reason a real staging environment on the production engine
    # remains outstanding work.
    enabled: false
  h2:
    console:
      enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  security:
    # Local dev runs over plain HTTP, an accepted and documented gap. This is
    # the only place that opts out of transport security, and it also relaxes
    # the CORS origin check to permit the http://localhost frontend.
    require-https: false
  admin:
    # The username is not a secret, so a stable dev default is fine.
    username: ${APP_ADMIN_USERNAME:admin}
    # Empty default, not a fixed password. AdminBootstrapRunner treats blank
    # as "generate a random one for this boot and log it once", so `mvn
    # spring-boot:run -Dspring-boot.run.profiles=dev` still works with no
    # setup, but there is no published credential to try against a dev or
    # demo instance that happens to be reachable. Set APP_ADMIN_PASSWORD to
    # pin it to something stable across restarts.
    #
    # This blank-default trick is confined to dev on purpose: the base
    # profile's placeholder has no default at all, so the generate path is
    # structurally unreachable outside dev — an unset password there fails
    # startup instead.
    password: ${APP_ADMIN_PASSWORD:}

---
# Production profile.
#
# Before this existed, the only datasource in the application was the dev one:
# in-process H2, user `sa` with a blank password, `ddl-auto: update` and no
# migrations. The application as committed could not start outside dev at all,
# which meant several controls hardened earlier — HTTPS enforcement, CORS origin
# validation, Secure cookies — were protecting a deployment that did not exist.
#
# Nothing here has a usable default. Every value is an unresolvable placeholder
# unless the environment supplies it, so a deployment that forgets one fails to
# start rather than silently falling back to something weaker. That is the same
# fail-fast rule the admin credentials already follow, applied to the datasource.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # JDBC URL for the external database. No default: an absent URL must stop
    # startup, not fall back to an in-memory database that accepts writes and
    # loses them on restart — the failure mode where everything looks healthy and
    # nothing is persisted.
    #
    # TLS to the database belongs in this URL, and the parameters are
    # engine-specific. For PostgreSQL:
    #   ...?sslmode=verify-full&sslrootcert=/etc/ssl/certs/db-ca.crt
    # verify-full rather than require: `require` encrypts without checking who is
    # on the other end, so it stops passive sniffing and not an active
    # man-in-the-middle, which is the threat that matters for credentials in
    # transit.
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    # Supplied by the platform's secret mechanism — a mounted file, an injected
    # environment variable from a secret manager, or an IAM-derived token. Never
    # committed, and deliberately not defaulted.
    password: ${APP_DB_PASSWORD}
    hikari:
      # Bounded pool. The Tomcat thread ceiling is 100; a pool larger than the
      # database can serve just moves queuing from the application to the
      # database, where it is harder to see.
      maximum-pool-size: ${APP_DB_POOL_MAX:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:2}
      connection-timeout: 10s
  jpa:
    hibernate:
      # validate, never update. `update` lets the running application alter the
      # schema, which is an ambient write privilege over the data model and a
      # silent divergence between environments: the schema becomes whatever the
      # entity classes happened to say on the day each instance started, with no
      # record of the change. `validate` fails startup when the schema and the
      # entities disagree, which turns a drift into a deployment failure instead
      # of a data problem discovered later.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # The schema this validates against is created by the checked-in migrations
    # and nothing else. baseline-on-migrate stays false so pointing a fresh
    # deployment at a database that already has tables fails loudly rather than
    # assuming its current state is the baseline.
    baseline-on-migrate: false
    validate-on-migrate: true

  h2:
    console:
      enabled: false

logging:
  # Structured output, replacing key=value text nobody can query reliably. ECS
  # because it is the format the common aggregators ingest without a custom
  # parser, and because a parser is the part that breaks silently when a log line
  # gains a field.
  #
  # This is also what makes the log-forging defences meaningful: in JSON, a
  # newline inside a value is escaped by the encoder, so a forged line cannot be
  # produced by content alone. The validation and sanitising remain, because
  # something still has to hold when a plaintext appender is configured.
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${APP_LOG_FILE:/var/log/hello-world-auth-app/application.log}
  logback:
    rollingpolicy:
      # Retention, enforced rather than described. 90 days matches the period
      # stated in the privacy notice; without a cap the rotation policy is
      # "forever", which is the finding.
      #
      # Access control on the directory is a deployment concern this file cannot
      # enforce — the logs carry pseudonymous references rather than usernames
      # specifically so that a wider-than-intended read grant is less damaging.
      max-history: ${APP_LOG_MAX_HISTORY:90}
      max-file-size: 100MB
      total-size-cap: 5GB
      clean-history-on-start: false
