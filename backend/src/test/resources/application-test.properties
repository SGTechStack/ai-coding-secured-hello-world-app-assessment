spring.datasource.url=jdbc:h2:mem:secured-hello-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.cors.allowed-origins=http://localhost:3000
logging.structured.ecs.service.environment=test
app.ip-hash.key=synthetic-test-ip-hash-key
# Synthetic Bootstrap Admin for API tests (required outside dev).
app.bootstrap-admin.username=testadmin
app.bootstrap-admin.password=Synthetic-Admin-Pass-42
app.bootstrap-admin.email=testadmin@test.example.com
# Actuator on a random free port, so parallel test contexts never collide on the configured one.
management.server.port=0
# Synthetic Prometheus scrape credential for the management port.
app.management.prometheus.password=synthetic-test-scrape-password
