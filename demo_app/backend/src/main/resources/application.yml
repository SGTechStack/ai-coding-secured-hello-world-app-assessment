spring:
  application:
    name: demo_app
  datasource:
    url: jdbc:h2:mem:demo_app;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  error:
    # ApiErrorController renders /error as a generic ApiError; these keep Spring's defaults from
    # ever adding detail should anything fall back to them.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      # Inactivity timeout, enforced server-side.
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        # Only the dev profile turns this off, for plain-HTTP localhost.
        secure: true

logging:
  structured:
    format:
      # ECS JSON console lines: machine-parseable and escaped. Only the dev profile turns this off.
      console: ecs

app:
  security:
    throttle:
      # Per-IP limits, in memory on this instance only. Each throttle forgets its oldest address
      # beyond this many, so a flood of addresses can't exhaust memory.
      max-tracked-ips: 100000
      login:
        # Failed logins only: successes never count.
        max-attempts: 20
        window: 15m
      registration:
        # Every request counts, whatever its outcome: this also caps username/email probing.
        max-attempts: 10
        window: 15m
  # The bootstrap admin (app.admin.username, app.admin.email, app.admin.password) has no default
  # here or in prod: set APP_ADMIN_USERNAME, APP_ADMIN_EMAIL and APP_ADMIN_PASSWORD. While no ADMIN
  # exists, startup fails without them (see AdminBootstrap).
