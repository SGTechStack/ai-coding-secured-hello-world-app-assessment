# SPA served from the local frontend build
app.spa.static-location=file:./../frontend/dist/

# Local test users — username only, no password required (noop)
app.local.users[0].username=alice
app.local.users[0].roles=USER
app.local.users[1].username=bob
app.local.users[1].roles=USER
app.local.users[2].username=charlie
app.local.users[2].roles=USER_MANAGER
app.local.users[3].username=dave
app.local.users[3].roles=USER_MANAGER

# JPA / Hibernate — non-destructive: adds missing tables/columns, never drops. The H2 file under
# ./data persists across restarts (including devtools restarts on recompile); run `./mvnw clean`
# to wipe it for a fresh schema.
spring.jpa.hibernate.ddl-auto=update
# Seeding is off by default (mode=never) because re-running INSERTs against a persisted, non-empty
# DB fails on primary-key conflicts on every restart. After `./mvnw clean` wipes the DB, flip this
# to `always` for one run to reseed from data-local.sql, then set it back to `never`.
spring.sql.init.mode=never

# SQL Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Enable H2 console for local development and testing, with relaxed security settings since it's only active in the local profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AUTO_SERVER=TRUE lets the H2 console / an external SQL client connect to this same file while
# the app is running, instead of being locked out by H2's single-writer file mode.
spring.datasource.url=jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver

# Initial admin (ticket 02): no password is committed. Set app.admin.password in a git-ignored
# ./config/application-local.properties or via APP_ADMIN_PASSWORD to seed one; without it, local
# starts with no admin.
app.admin.password-required=false
