spring:
  application:
    name: secured-hello-world-backend

logging:
  structured:
    format:
      console: ecs
      file: ecs

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 15m
      cookie:
        http-only: true
        same-site: lax
        secure: true

app:
  frontend:
    origin: http://localhost:3000
  admin:
    username: admin
    password: ChangeMe123456!
  security:
    max-concurrent-sessions: 5
    lockout:
      max-attempts: 5
      duration-minutes: 15
    password-reset:
      token-expiry-minutes: 30
    account-lifecycle:
      dormancy-days: 90
      dormancy-check-cron: "0 0 3 * * *"
    access-review:
      cron: "0 30 3 * * *"
      authorised-admin-usernames:
        - admin

management:
  endpoints:
    web:
      exposure:
        include: health,info
