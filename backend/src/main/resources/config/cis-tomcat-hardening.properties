# =============================================================================
# CIS Apache Tomcat 11 Benchmark Hardening
# Reference: CIS Apache Tomcat 10.1 Benchmark v1.1.0 (controls apply to Tomcat 11)
# Only controls expressible via application.properties are listed here.
# SSL/TLS and HTTPS-only controls live in application-feat-https.properties.
# =============================================================================

# CIS 2.4 – Remove the Server response header to avoid advertising the server version.
server.server-header=

# CIS 2.5 – Do not expose internal error details, exception class names, or stack traces
#           in HTTP responses. Prevents information disclosure to clients.
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Use RFC 9457 Problem Detail responses for consistent error payloads.
spring.mvc.problemdetails.enabled=true

# CIS 2.6 – Disable the HTTP TRACE method to prevent cross-site tracing (XST) attacks.
spring.mvc.dispatch-trace-request=false

# CIS 4.1 – Enable Tomcat access logging so every inbound request is recorded.
# CIS 4.4 – Write logs to ./logs, outside the application classpath.
# CIS 4.5 – Retain logs for 90 days; rotate daily.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=./logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D "%{Referer}i" "%{User-Agent}i"
server.tomcat.accesslog.rotate=true
server.tomcat.accesslog.max-days=90
server.tomcat.accesslog.buffered=false

# CIS 6.2 – Set a connection timeout to release idle/abandoned connections promptly.
#           Also cap keep-alive so stale connections do not hold threads indefinitely.
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=20s

# CIS 8.1 – Cap the number of accepted connections to guard against connection-flood DoS.
server.tomcat.max-connections=8192

# CIS 8.2 – Limit the backlog queue size for incoming connections.
server.tomcat.accept-count=100

# CIS 8.3 – Limit the total number of query + POST parameters to prevent parameter-pollution
#           and resource-exhaustion attacks.
server.tomcat.max-parameter-count=1000

# CIS 8.4 – Limit how much of a rejected request body Tomcat will read/swallow; prevents
#           slow-body resource exhaustion.
server.tomcat.max-swallow-size=2MB

# CIS 8.5 – Cap multipart/form-data POST body size.
server.tomcat.max-http-form-post-size=2MB

# CIS 8.6 – Limit pipelined keep-alive requests per connection.
server.tomcat.max-keep-alive-requests=100

# CIS 8.7 – Bound the size of inbound HTTP request headers to prevent header-injection
#           and memory-exhaustion attacks.
server.max-http-request-header-size=8KB

# CIS 8.8 – Bound the size of outbound HTTP response headers.
server.tomcat.max-http-response-header-size=8KB

# CIS 11.1 – Mark session cookies as HttpOnly so JavaScript cannot read them.
server.servlet.session.cookie.http-only=true

# CIS 11.2 – Restrict the SameSite attribute to Strict to prevent CSRF via cookie leakage.
server.servlet.session.cookie.same-site=strict

# CIS 11.3 – Use cookie-only session tracking; disables URL-based session IDs (session
#            fixation / session ID in URL).
server.servlet.session.tracking-modes=cookie

# CIS 11.4 – Enforce a short session idle timeout to limit the window of a stolen session.
server.servlet.session.timeout=15m

# CIS 12.1 – Disable Tomcat's MBean / JMX registry to shrink the JMX attack surface.
server.tomcat.mbeanregistry.enabled=false

# CIS 12.2 – Disable the default servlet to prevent unintended static-file serving and
#            directory listing.
server.servlet.register-default-servlet=false
