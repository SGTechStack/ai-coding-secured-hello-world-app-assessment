# MSSQL datasource. host/port/username/password all come from the APP_CONFIG_TF_SECRET_NAME import
# (db_host/db_port/db_username/db_password — fully Terraform-derived, kept in sync automatically
# since Terraform overwrites that secret every apply; see application-feat-aws-secrets.properties).
#
# All four bind the namespaced db_* keys, not a secret's flat username/password keys. Two reasons:
# (1) the app credential now lives only in the tf-config secret, not the RDS master secret; and
# (2) on Windows the bare ${username} placeholder relaxed-binds to the OS USERNAME env var (the
# service account under LocalSystem), which outranks spring.config.import and would shadow a flat
# key. Spring Cloud AWS 4.0 has no per-import key prefix to disambiguate, so the db_* namespace is
# the unambiguous source for every field.
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${db_host:}:${db_port:1433};databaseName=${db_name:demo};trustServerCertificate=true
spring.datasource.username=${db_username:}
spring.datasource.password=${db_password:}
