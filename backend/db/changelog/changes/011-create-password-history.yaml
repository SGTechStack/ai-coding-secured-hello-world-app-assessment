databaseChangeLog:
  - changeSet:
      id: 011-create-password-history
      author: builderday
      comment: Password history - the BCrypt hashes of an account's current and recent passwords, so none is reused.
      changes:
        - createTable:
            tableName: password_history
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_history_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: password_hash
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: password_history
            indexName: ix_password_history_user_id
            columns:
              - column:
                  name: user_id
