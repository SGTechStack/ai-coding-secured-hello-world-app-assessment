# ---- Application ----
spring.application.name=demo-backend
spring.main.banner-mode=off
app.spa.static-location=file:./static/

# ---- Profiles ----
# Default to prod; override via environment variable or command line argument.
spring.profiles.default=prod

# For deployed cloud environments (dev, qa, preprod, prod):
# - feat-xxx sub-profiles are features that can be enabled/disabled independently of the base profile
# - unsafe-xxx sub-profiles are unsafe for production but useful for local development or testing
spring.profiles.group.local=unsafe-openapi, unsafe-debug
spring.profiles.group.test=unsafe-openapi, unsafe-debug
spring.profiles.group.dev=unsafe-openapi, unsafe-debug, feat-aws-secrets, feat-mssql, feat-https, feat-redis, feat-oidc
spring.profiles.group.qa=feat-aws-secrets, feat-mssql, feat-https, feat-redis, feat-oidc
spring.profiles.group.preprod=feat-aws-secrets, feat-mssql, feat-https, feat-redis, feat-oidc
spring.profiles.group.prod=feat-aws-secrets, feat-mssql, feat-https, feat-redis, feat-oidc

# ---- Runtime ----
# Virtual threads (Java 21): handle more concurrent requests with fewer platform threads.
spring.threads.virtual.enabled=true

# ---- Persistence ----
# Disable Open Session in View to avoid lazy loading outside transactions (e.g. N+1 queries).
spring.jpa.open-in-view=false

# Schema managed by Liquibase in deployed profiles — Hibernate must not modify it.
spring.jpa.hibernate.ddl-auto=none

# Liquibase is off by default. The changesets under db/changelog are MSSQL-specific
# (datetimeoffset, uniqueidentifier, ...) and will not run on the H2 datasource used by
# local/test, which build their schema from entities via ddl-auto=create-drop instead.
# The feat-mssql profile (dev/qa/preprod/prod) re-enables it.
spring.liquibase.enabled=false

# Disabled by default so AWS credentials are not required locally or in tests.
spring.cloud.aws.secretsmanager.enabled=false

# ---- API docs ----
# Unavailable unless an allowed non-production profile enables them explicitly.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---- Logging ----
# ECS structured logging for log parsing and analysis in cloud environments.
logging.structured.format.file=ecs
logging.file.name=${LOG_FILE_NAME:./logs/log.json}

# ---- Actuator ----
management.server.port=9090
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ---- Hardening ----
# CIS Apache Tomcat benchmark controls, kept separate for auditability.
spring.config.import=classpath:config/cis-tomcat-hardening.properties
