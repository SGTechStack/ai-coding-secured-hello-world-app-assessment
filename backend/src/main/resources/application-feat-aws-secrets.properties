# Required deployed environment like dev, qa, preprod, and prod.
# The secret should contain Redis and any other environment-specific Spring properties as JSON keys
# that are set manually (ops-edited). In this way, you can manage environment-specific configuration
# in one place and avoid hardcoding them in the codebase.
#
# One other secret chains in alongside it:
# - APP_CONFIG_TF_SECRET_NAME: fully Terraform-derived values (db_host, db_port, db_username,
#   db_password, ...) — never hand-edit, Terraform overwrites it every apply.
#   See application-feat-mssql.properties.
spring.config.import=aws-secretsmanager:${APP_CONFIG_SECRET_NAME},optional:aws-secretsmanager:${APP_CONFIG_TF_SECRET_NAME:}
spring.cloud.aws.secretsmanager.region=${AWS_REGION:ap-southeast-1}
# Base application.properties disables Secrets Manager (so local/test don't need AWS creds).
# This profile IS the AWS-secrets feature — re-enable it here, or every aws-secretsmanager:
# import above silently resolves to empty (app starts, but no secret keys land).
spring.cloud.aws.secretsmanager.enabled=true
