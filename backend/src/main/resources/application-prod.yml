spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Portable to Postgres/MySQL; overridden via env in real deployments.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        secure: true
