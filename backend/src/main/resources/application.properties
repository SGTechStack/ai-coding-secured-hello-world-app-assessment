spring.application.name=secured-hello-world

# Logging: ECS JSON everywhere (logback-spring.xml, EcsLogFormatter). Service fields on every line.
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=local
app.logging.directory=logs
app.logging.application-file=${app.logging.directory}/application.log
app.logging.audit-file=${app.logging.directory}/audit.log
# Audit history kept on disk, in days (at least 90). Central retention is a deployment requirement.
app.logging.audit-max-history-days=90
# SQL is logged only in dev (application-dev.properties), through the logger so output stays JSON.
spring.jpa.show-sql=false
# These libraries log JDBC URLs, database names and the database user at INFO.
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN
logging.level.org.flywaydb.core.FlywayExecutor=WARN
logging.level.org.hibernate.orm.connections.pooling=WARN

# API
app.api.base-path=/api
# Largest accepted request body, in bytes (max 10 MiB). The single body-size limit: larger bodies,
# with or without Content-Length, get 400 request_too_large before any controller runs.
app.api.max-request-body-bytes=16384
# CORS allowlist: required outside the dev profile (startup fails without it). No wildcards.
# app.cors.allowed-origins=https://app.example.gov

# Persistence: schema comes only from Flyway, never Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/{vendor}
spring.session.jdbc.initialize-schema=never

# Session cookie (HttpOnly, SameSite=Lax): Secure everywhere except dev (see application-dev.properties).
app.session.cookie-secure=true

# Never leak internals in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

spring.h2.console.enabled=false
