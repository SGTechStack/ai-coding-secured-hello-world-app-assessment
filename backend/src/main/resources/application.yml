server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m

spring:
  datasource:
    url: jdbc:h2:mem:hellodesk;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    timeout: 30m
    jdbc:
      initialize-schema: always

app:
  admin:
    username: admin
    password: ChangeMe-Admin1
    email: admin@example.com
  security:
    lockout-max-attempts: 5
    lockout-duration: 15m
    ip-max-attempts: 20
    ip-window: 15m
    password-reset-ttl: 20m
    bcrypt-strength: 10
    secure-cookies: false
    frontend-origin: http://localhost:3000
  cors:
    allowed-origins:
      - http://localhost:3000
