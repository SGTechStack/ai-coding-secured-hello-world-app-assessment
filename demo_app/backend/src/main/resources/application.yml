spring:
  application:
    name: demo_app
  datasource:
    url: jdbc:h2:mem:demo_app;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080
  error:
    # ApiErrorController renders /error as a generic ApiError; these keep Spring's defaults from
    # ever adding detail should anything fall back to them.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  servlet:
    session:
      # Inactivity timeout, enforced server-side.
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        # Only the dev profile turns this off, for plain-HTTP localhost.
        secure: true
