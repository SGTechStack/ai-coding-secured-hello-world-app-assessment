# Properties for debugging on non-production environments. This profile is unsafe for production.
spring.web.error.include-stacktrace=always
spring.web.error.include-exception=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# Application
# Logs application debug statements (e.g. chat agent request/response payloads).
logging.level.org.eds.demo=DEBUG

# Startup & Configuration
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.springframework.beans.factory=INFO
# Traces Secrets Manager fetch + which spring.config.import locations resolve (empty vs populated).
logging.level.io.awspring.cloud.secretsmanager=DEBUG
logging.level.org.springframework.boot.context.config=DEBUG

## Web
# Traces HTTP request and response handling.
logging.level.org.springframework.web=INFO
# Security
logging.level.org.springframework.security=INFO

## JPA/Hibernate
# Logs SQL statements generated by Hibernate. Useful for debugging database interactions and optimizing queries.
logging.level.org.hibernate.SQL=INFO
# Logs the values of parameters bound to SQL statements. Useful for debugging query parameters and ensuring correct data is being passed to the database.
logging.level.org.hibernate.type.descriptor.sql=TRACE
