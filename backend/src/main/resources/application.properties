spring.application.name=auth-app

spring.profiles.active=prod

# Datasource (url/driver-class-name) is set per-profile, not here -- see
# application-dev.properties / application-prod.properties. PRD: "H2 to start
# (dev profile), schema portable to Postgres/MySQL later"; keeping it
# profile-specific now means swapping prod to a real database later only
# touches application-prod.properties.

# JPA / Hibernate: schema managed by Hibernate. AdminBootstrapRunner seeds
# the initial ADMIN account on startup, replacing the old data.sql seed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# App-Standards Standalone auth track: 15-minute idle timeout. Spring Session
# picks this up as its max inactive interval (spring.session.timeout falls
# back to it), so it is enforced by the session store itself.
server.servlet.session.timeout=15m

# Spring Session JDBC: sessions live in SPRING_SESSION / SPRING_SESSION_ATTRIBUTES
# on the app's own datasource. "always" rather than the default "embedded" so
# the tables are also created on a non-embedded prod database, matching how
# Hibernate's ddl-auto=update already manages the rest of the schema.
spring.session.jdbc.initialize-schema=always

# --- Account lockout / IP throttling / password-reset token TTL ---
# Identical across dev and prod; only CORS origins, the frontend base URL, admin
# bootstrap credentials, the H2 console, cookie security attributes, and
# forwarded-header trust vary by profile (see application-dev.properties / application-prod.properties).
app.security.lockout.max-attempts=5
# Failures only count toward a lockout while inside this window. One IP may
# put at most max-attempts - 1 failures on a single username within it before
# the IP throttle blocks that IP, so no single source can lock an account.
app.security.lockout.window=15m
app.security.lockout.duration=15m
app.security.ip-throttle.max-attempts=20
app.security.ip-throttle.window=15m
app.security.ip-throttle.block-duration=15m
app.security.password-reset.token-ttl=30m
