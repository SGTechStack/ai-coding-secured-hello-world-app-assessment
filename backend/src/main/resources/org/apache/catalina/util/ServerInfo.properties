# CIS 2.1-2.3 – Suppress Tomcat version strings in HTTP responses and error pages.
# This file shadows org/apache/catalina/util/ServerInfo.properties from catalina.jar
# because Spring Boot's fat-jar classloader resolves application resources before
# embedded jar entries.  Empty values cause Tomcat to omit the version information
# from the Server response header, error page footers, and JMX attributes.
server.info=
server.number=
server.built=
