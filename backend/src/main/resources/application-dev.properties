# Local development only. SPA on http://localhost:3000, API on http://localhost:8080, no proxy.
server.port=8080
app.cors.allowed-origins=http://localhost:3000

spring.datasource.url=jdbc:h2:file:./data/secured-hello-world
spring.datasource.username=sa
spring.datasource.password=

# Local HTTP: browsers (Safari in particular) reject Secure cookies on http://localhost.
app.session.cookie-secure=false

spring.h2.console.enabled=true
# SQL logging in dev only, through the logger (not show-sql, which writes plain text to stdout).
logging.level.org.hibernate.SQL=DEBUG
logging.structured.ecs.service.environment=dev
