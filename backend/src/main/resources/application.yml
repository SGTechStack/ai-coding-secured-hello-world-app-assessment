spring:
  application:
    name: hello-world-auth-app

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Real deployments must sit behind HTTPS (required for Secure
        # cookies); local dev runs over HTTP, so this is overridden to
        # false in the dev profile below.
        secure: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    # Base URL the frontend is served from, used to build links that leave
    # the backend (e.g. the password reset link emailed to users). Defaults
    # to the dev frontend origin; must be overridden to the real deployed
    # frontend URL outside dev.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  admin:
    # Deliberately no defaults here. Both placeholders are unresolvable if
    # the environment does not supply them, so a deployment that forgets to
    # set admin credentials fails to start rather than booting with a
    # guessable account. The dev profile below relaxes this, but only as far
    # as a per-boot random password — never a fixed one.
    username: ${APP_ADMIN_USERNAME}
    password: ${APP_ADMIN_PASSWORD}
  security:
    # Configuration-owned RBAC (see
    # App-Standards/Appfw-User-Standards/Shared_Recipes/Common_Role-Based_Access_Control_Configuration.md).
    # This is the single source of truth for which role holds which
    # fine-grained authority, and which HTTP method+path each authority
    # guards. SecurityConfig's filter chain is built entirely from this
    # block; changing access to an endpoint means editing this file, not
    # Java.
    #
    # role-mappings: which authorities a role is entitled to. USER's
    # authorities are also reachable by ADMIN via the role-hierarchy
    # below, so ADMIN does not need HELLO_READ repeated here.
    role-mappings:
      ADMIN: [ADMIN_USER_READ, ADMIN_USER_WRITE]
      USER: [HELLO_READ]
    # ROLE_ADMIN inherits every authority reachable by ROLE_USER, so an
    # admin can reach USER-guarded endpoints without USER's authorities
    # being duplicated into ADMIN's role-mapping above.
    role-hierarchy: "ROLE_ADMIN > ROLE_USER"
    # Authority -> the HTTP method+path pairs it guards. Every guarded
    # route must appear here exactly once; anything not covered by this
    # map or the whitelist below is denied by default.
    url-guards:
      HELLO_READ:
        - method: GET
          path: /api/hello
      ADMIN_USER_READ:
        - method: GET
          path: /api/admin/users
      ADMIN_USER_WRITE:
        - method: PATCH
          path: /api/admin/users/*/enabled
        - method: PATCH
          path: /api/admin/users/*/role
        - method: DELETE
          path: /api/admin/users/*
    # Routes reachable without authentication. Kept as small as possible:
    # only what a client needs before it has a session (registration,
    # login, the CSRF token endpoint, health, password reset).
    #
    # The H2 console is deliberately NOT here. It used to be, which meant
    # an unauthenticated full-SQL surface was whitelisted in every profile
    # on the argument that the servlet only exists in dev. The rule and the
    # servlet are now gated by the same thing: H2ConsoleSecurityConfig is
    # @Profile("dev"), so outside dev /h2-console/** is covered by neither
    # the whitelist nor a url-guard and is therefore denied by default.
    whitelist:
      - /api/auth/register
      - /api/health
      - /api/csrf
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/password-reset/request
      - /api/auth/password-reset/confirm

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:hello-world-auth-app;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  admin:
    # The username is not a secret, so a stable dev default is fine.
    username: ${APP_ADMIN_USERNAME:admin}
    # Empty default, not a fixed password. AdminBootstrapRunner treats blank
    # as "generate a random one for this boot and log it once", so `mvn
    # spring-boot:run -Dspring-boot.run.profiles=dev` still works with no
    # setup, but there is no published credential to try against a dev or
    # demo instance that happens to be reachable. Set APP_ADMIN_PASSWORD to
    # pin it to something stable across restarts.
    #
    # This blank-default trick is confined to dev on purpose: the base
    # profile's placeholder has no default at all, so the generate path is
    # structurally unreachable outside dev — an unset password there fails
    # startup instead.
    password: ${APP_ADMIN_PASSWORD:}
