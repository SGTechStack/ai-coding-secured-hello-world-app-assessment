<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Access Denied — DEMO</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #fafaf9;
                color: #1e293b;
            }
            .container {
                text-align: center;
                padding: 2rem;
            }
            h1 {
                font-size: 4rem;
                font-weight: 700;
                color: #94a3b8;
                margin-bottom: 0.5rem;
            }
            p {
                font-size: 1.125rem;
                color: #64748b;
                margin-bottom: 1.5rem;
            }
            .actions {
                display: flex;
                gap: 0.75rem;
                justify-content: center;
            }
            a,
            button {
                display: inline-block;
                padding: 0.625rem 1.25rem;
                text-decoration: none;
                border-radius: 0.375rem;
                font-size: 0.875rem;
                font-weight: 500;
                font-family: inherit;
                cursor: pointer;
                border: 1px solid #0f172a;
            }
            a {
                background: #0f172a;
                color: #fff;
            }
            a:hover {
                background: #1e293b;
            }
            button {
                background: transparent;
                color: #0f172a;
            }
            button:hover {
                background: #f1f5f9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>403</h1>
            <p>Your account doesn't have access to this application.</p>
            <div class="actions">
                <a href="/">Go home</a>
                <button type="button" id="signout">Sign out</button>
            </div>
        </div>
        <script>
            // Read the XSRF-TOKEN cookie and echo it as X-XSRF-TOKEN, mirroring the SPA's
            // fetch wrapper, so logout works under the CSRF-protected non-local profiles too.
            document.getElementById("signout").addEventListener("click", function () {
                var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
                var headers = match ? { "X-XSRF-TOKEN": decodeURIComponent(match[1]) } : {};
                fetch("/logout", { method: "POST", headers: headers }).then(function () {
                    window.location.href = "/";
                });
            });
        </script>
    </body>
</html>
