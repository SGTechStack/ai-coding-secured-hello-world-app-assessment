spring:
  application:
    name: hello-world-auth-app
  flyway:
    # Schema owned by migrations, not Hibernate, in every profile (incl. dev).
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        type:
          # Enums as varchar, not H2's native ENUM, so adding a constant needs
          # no migration.
          preferred_enum_jdbc_type: VARCHAR

server:
  # Framework's view of the request; throttle's view is app.security.trusted-proxy-hops.
  # Off by default: only enable behind a proxy you trust to set X-Forwarded-*.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    # Caps on unauthenticated request cost. Body size itself is enforced by
    # MaxRequestSizeFilter, since max-http-form-post-size only covers form bodies.
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    max-http-request-header-size: 16KB
    threads:
      max: 100
    max-connections: 2000
    accept-count: 100
  servlet:
    session:
      # Idle timeout; paired with app.security.session-absolute-timeout for total lifetime.
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        # Overridden to false in dev, which runs over HTTP.
        secure: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  logging:
    # Salt for pseudonymous user references in logs/audit rows (see UserPseudonym).
    # Unset = generate per boot, so pseudonyms aren't reversible from this file.
    pseudonym-salt: ${APP_LOG_PSEUDONYM_SALT:}
  retention:
    # Reset-token rows: kept this long past expiry/use, then deleted. Not purged
    # on expiry, so "was this link consumed" stays answerable during an investigation.
    reset-token-grace: ${APP_RESET_TOKEN_GRACE:P7D}
    purge-interval: ${APP_PURGE_INTERVAL:PT1H}
    # Delayed off the startup path so it doesn't compete with schema setup/admin bootstrap.
    purge-initial-delay: ${APP_PURGE_INITIAL_DELAY:PT5M}
    # Off in tests, so the scheduler can't delete rows a test is asserting on.
    purge-enabled: ${APP_PURGE_ENABLED:true}
  privacy:
    # Notice shown at collection and served from GET /api/privacy-notice.
    # See docs/adr/0005-personal-data-lawful-basis-and-retention.md.
    controller: ${APP_PRIVACY_CONTROLLER:Hello World Auth App (reference implementation)}
    contact: ${APP_PRIVACY_CONTACT:privacy@example.invalid}
    lawful-basis: >-
      Performance of a contract: the email address is required to operate the
      account it belongs to, specifically to deliver a password reset link at
      the account holder's request. It is used for nothing else — no marketing,
      no profiling, no disclosure to third parties.
    data-collected:
      - "Username — identifies the account at sign-in and in audit records."
      - "Email address — used solely to deliver a password reset link you ask for."
      - "Password — stored only as a BCrypt hash; the password itself is never stored or logged."
      - "Sign-in activity — failed attempt counts and lockout times, to detect and slow brute-force attacks."
    retention:
      - "Account data (username, email, password hash): kept until you erase the account."
      - "Password reset requests: deleted 7 days after the link expires or is used."
      - "Security and audit logs: retained 90 days, then deleted."
      - "Administrative audit records: retained 1 year for accountability, and identify accounts by a pseudonymous reference rather than by name."
    rights:
      - "Access — download everything held about your account from Account, Download my data."
      - "Erasure — delete your account and its data from Account, Delete my account."
      - "Rectification — change your password at any time; contact us to correct a username or email."
      - "Complaint — contact the address above."
    last-updated: ${APP_PRIVACY_LAST_UPDATED:2026-09-24}
  frontend:
    # Base URL for links leaving the backend (e.g. password reset email).
    # Override outside dev.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  admin:
    # No defaults: a deployment without these fails to start rather than
    # booting with a guessable account. Dev profile relaxes this below.
    username: ${APP_ADMIN_USERNAME}
    password: ${APP_ADMIN_PASSWORD}
  security:
    # Proxy hop count, used to pick which address to throttle. 0 = directly
    # reachable, X-Forwarded-For ignored. Set to the real hop count behind a
    # proxy, or every client shares one throttle bucket.
    trusted-proxy-hops: ${APP_TRUSTED_PROXY_HOPS:0}
    # Rejects plaintext requests when true. Dev sets this false (HTTP by design).
    require-https: ${APP_REQUIRE_HTTPS:true}
    # Only emitted on requests that already arrived over HTTPS.
    hsts-max-age: 365d
    # Absolute session ceiling, independent of idle timeout.
    session-absolute-timeout: 8h
    # Rejected up front from Content-Length. Not a substitute for an ingress
    # limit — chunked requests have no Content-Length to check.
    max-request-body-size: 64KB
    # This API serves only JSON, so its own CSP permits nothing. Does not
    # cover the SPA, which is a separate origin with its own CSP.
    content-security-policy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
    # Per-caller request-rate limits on unauthenticated write endpoints. These
    # count requests, not failures (unlike the login throttle), since register/
    # reset-request succeed every time yet still cost a BCrypt hash or a
    # reset-token write. Login isn't listed here — IpLoginThrottle covers it.
    rate-limits:
      - name: register
        method: POST
        path: /api/auth/register
        max-requests: 10
        window: 1h
      - name: password-reset-request
        method: POST
        path: /api/auth/password-reset/request
        max-requests: 5
        window: 1h
      - name: password-reset-confirm
        method: POST
        path: /api/auth/password-reset/confirm
        max-requests: 10
        window: 1h
    # Configuration-owned RBAC (see
    # App-Standards/Appfw-User-Standards/Shared_Recipes/Common_Role-Based_Access_Control_Configuration.md).
    # Single source of truth for role -> authority and authority -> route.
    # SecurityConfig builds its filter chain from this block.
    #
    # role-mappings: authorities per role. ADMIN reaches USER's authorities via
    # role-hierarchy below, so they aren't repeated here.
    # ADMIN_USER_EMAIL_READ is split from ADMIN_USER_READ so a future read-only
    # role could get the listing without the email addresses behind it.
    # ACCOUNT_SELF_MANAGE sits on USER; ADMIN reaches it via role-hierarchy.
    role-mappings:
      ADMIN: [ADMIN_USER_READ, ADMIN_USER_EMAIL_READ, ADMIN_USER_WRITE]
      USER: [HELLO_READ, ACCOUNT_SELF_MANAGE]
    # ADMIN inherits everything reachable by USER.
    role-hierarchy: "ROLE_ADMIN > ROLE_USER"
    # Authority -> guarded method+path pairs. Anything not covered here or by
    # the whitelist below is denied by default.
    url-guards:
      HELLO_READ:
        - method: GET
          path: /api/hello
      ADMIN_USER_READ:
        - method: GET
          path: /api/admin/users
      # One account at a time, with a mandatory purpose and an audit row.
      ADMIN_USER_EMAIL_READ:
        - method: GET
          path: /api/admin/users/*/email
      # Subject is always the authenticated principal; no id param means no
      # path to another user's data.
      ACCOUNT_SELF_MANAGE:
        - method: GET
          path: /api/account/export
        - method: DELETE
          path: /api/account
      ADMIN_USER_WRITE:
        - method: PATCH
          path: /api/admin/users/*/enabled
        - method: POST
          path: /api/admin/users/*/unlock
        - method: PATCH
          path: /api/admin/users/*/role
        - method: DELETE
          path: /api/admin/users/*
    # Unauthenticated routes. Kept minimal. H2 console is deliberately absent
    # here — it's gated by @Profile("dev") on H2ConsoleSecurityConfig instead,
    # so outside dev it's denied by default rather than relying on this list.
    whitelist:
      - /api/auth/register
      # Must be readable pre-registration; contains no personal data.
      - /api/privacy-notice
      - /api/health
      - /api/csrf
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/password-reset/request
      - /api/auth/password-reset/confirm

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:hello-world-auth-app;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # validate, not update, even in dev: Flyway owns the schema, Hibernate
      # just checks the entity model against it.
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  security:
    # Dev runs over plain HTTP by design; also relaxes CORS to allow http://localhost.
    require-https: false
  admin:
    # Not a secret; stable dev default is fine.
    username: ${APP_ADMIN_USERNAME:admin}
    # Fixed dev password by product decision. This is TM-07 (High) reinstated
    # for dev only: base profile still has no default, so a real deployment
    # that forgets APP_ADMIN_PASSWORD fails to start rather than inheriting
    # this value. AdminBootstrapRunner still generates a random password if
    # this is set blank.
    password: ${APP_ADMIN_PASSWORD:password1234}

---
# Production profile.
#
# H2 here too, by explicit product decision — one dialect for dev, tests and
# prod, so migrations are proven against the same engine they'll run on. See
# docs/adr/0004-h2-everywhere.md for the accepted trade-off: embedded H2 has no
# separate server, no concurrent-writer story beyond one JVM, no online backup
# or replication, and no cross-major-version file format guarantee.
#
# No usable defaults anywhere in this profile: an unset value fails startup
# rather than falling back to something weaker.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # No default. Expected form:
    #   jdbc:h2:file:/var/lib/hello-world-auth-app/db;DB_CLOSE_ON_EXIT=FALSE
    # file: (not mem:) for persistence across restarts.
    # DB_CLOSE_ON_EXIT=FALSE so the shutdown hook doesn't race Spring's own close.
    # Do not add AUTO_SERVER=TRUE — it opens an unauthenticated H2 TCP listener.
    # No TLS setting: the DB is in-process; the file itself needs OS-level
    # permissions and disk encryption instead.
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      # Bounded pool; H2's write path serialises regardless, so a large pool
      # just queues inside the engine instead of in Hikari.
      maximum-pool-size: ${APP_DB_POOL_MAX:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:2}
      # Milliseconds: Hikari binds this property as a plain long, not a
      # Spring Duration, so a unit suffix like "10s" fails at startup.
      connection-timeout: 10000
  jpa:
    hibernate:
      # validate, never update: schema drift fails deployment instead of
      # silently mutating the schema at runtime.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # False so a fresh deployment against a non-empty database fails loudly.
    baseline-on-migrate: false
    validate-on-migrate: true

  h2:
    console:
      enabled: false

logging:
  # Structured ECS output: the format common aggregators ingest without a
  # custom parser, and what makes log-forging defences meaningful (a newline
  # in a value is escaped by the encoder).
  structured:
    format:
      console: ecs
      file: ecs
  file:
    name: ${APP_LOG_FILE:/var/log/hello-world-auth-app/application.log}
  logback:
    rollingpolicy:
      # Matches the 90-day period stated in the privacy notice.
      max-history: ${APP_LOG_MAX_HISTORY:90}
      max-file-size: 100MB
      total-size-cap: 5GB
      clean-history-on-start: false
