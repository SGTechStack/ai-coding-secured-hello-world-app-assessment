spring:
  datasource:
    url: jdbc:h2:mem:hello-test;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    cookie-secure: false
    allowed-origins:
      - http://localhost:3000
    login:
      max-failed-attempts: 3
      lockout-duration: PT15M
      ip-max-failures: 6
      ip-window: PT15M
  password-reset:
    token-ttl: PT20M
    reset-url-base: http://localhost:3000/reset-password
  admin:
    username: rootadmin
    email: rootadmin@example.com
    password: Root-Secret-Passw0rd

logging:
  level:
    root: WARN
    AUDIT: INFO
